name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Verificar arquivos
        run: ls -la

      - name: Montar projeto Android
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon-192.png icon-512.png logo.png www/
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "KGM BANK" com.kgm.bank --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Guardar APK (aba Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: KGM-BANK-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publicar em Releases (link direto p/ baixar no celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: KGM BANK APK
          files: android/app/build/outputs/apk/debug/app-debug.apk
