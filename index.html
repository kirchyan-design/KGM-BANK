<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KGM BANK</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2F8;--card:#fff;--ink:#14213D;--mute:#5C6785;--line:#D9E0EC;--acc:#3F37C9;--on-acc:#fff;--pos:#0B7A52;--neg:#C0322A;--hero:#14213D;--on-hero:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1224;--card:#162038;--ink:#EAF0FF;--mute:#9AA6C6;--line:#26324F;--acc:#8B85FF;--on-acc:#0C1224;--pos:#4CD6A0;--neg:#FF8A80;--hero:#1E2A52;--on-hero:#fff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C1224;--card:#162038;--ink:#EAF0FF;--mute:#9AA6C6;--line:#26324F;--acc:#8B85FF;--on-acc:#0C1224;--pos:#4CD6A0;--neg:#FF8A80;--hero:#1E2A52;--on-hero:#fff;color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{overscroll-behavior-y:contain}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Sora,system-ui,-apple-system,"Segoe UI",sans-serif}
.app{max-width:480px;margin:0 auto;padding:16px 16px 96px}
h1,h2{margin:0;font-weight:700}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.top h1{font-size:20px}
.top small{color:var(--mute)}
.hero{background:var(--hero);color:var(--on-hero);border-radius:20px;padding:22px}
.hero .l{opacity:.75;font-size:14px}
.hero .v{font-size:36px;font-weight:700;letter-spacing:-.02em;margin:4px 0 16px;word-break:break-all}
.row{display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:12px;padding:13px 14px;font:600 15px Sora,system-ui,sans-serif;cursor:pointer;background:var(--acc);color:var(--on-acc)}
.btn.alt{background:transparent;color:inherit;border:1.5px solid currentColor}
.btn:focus-visible,input:focus-visible,.tab:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.hero .btn{background:#fff;color:#14213D}
.hero .btn.alt{background:transparent;color:#fff}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:16px}
.panel h2{font-size:17px;margin-bottom:12px}
label{display:block;font-size:14px;color:var(--mute);margin:12px 0 4px}
input{width:100%;padding:13px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:400 16px Sora,system-ui,sans-serif}
.err{color:var(--neg);font-size:14px;margin:10px 0 0;min-height:1em}
.tx{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.tx b{display:block;font-weight:600}
.tx small{color:var(--mute)}
.tx .a{font-weight:600;white-space:nowrap}
.in{color:var(--pos)}.out{color:var(--neg)}
.empty{color:var(--mute);margin:4px 0}
.sum{margin:0;padding:0}
.sum div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.sum div:last-child{border:0}
.sum dt{color:var(--mute)}.sum dd{margin:0;font-weight:600;text-align:right;word-break:break-all}
.ok{text-align:center}
.ok .c{width:56px;height:56px;border-radius:50%;background:var(--pos);color:var(--card);display:grid;place-items:center;font-size:28px;margin:0 auto 10px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav .in2{max-width:480px;margin:0 auto;display:flex;gap:6px}
.tab{flex:1;border:0;background:transparent;color:var(--mute);font:600 14px Sora,system-ui,sans-serif;padding:12px 4px;border-radius:12px;cursor:pointer}
.tab[aria-current="page"]{background:var(--bg);color:var(--acc)}
.vcard{background:linear-gradient(135deg,#3F37C9,#14213D);color:#fff;border-radius:18px;padding:20px;min-height:190px;display:flex;flex-direction:column;justify-content:space-between}
.vcard.off{filter:grayscale(1);opacity:.7}
.vcard .t{display:flex;justify-content:space-between;font-weight:700;letter-spacing:.05em}
.vcard .n{font-size:19px;letter-spacing:.08em;font-weight:600;word-break:break-all}
.vcard .m{display:flex;justify-content:space-between;gap:8px;font-size:13px;opacity:.9}
#ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 8px);width:38px;height:38px;margin-left:-19px;border-radius:50%;background:var(--card);color:var(--acc);border:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.18);display:grid;place-items:center;font-size:20px;z-index:50;opacity:0;transform:translateY(-60px);pointer-events:none}
#ptr.spin span{display:block;animation:ptrs .7s linear infinite}
@keyframes ptrs{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#ptr.spin span{animation:none}}
.note{color:var(--mute);font-size:13px;margin-top:20px;text-align:center}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="ptr" aria-hidden="true"><span>↻</span></div>
<nav><div class="in2" id="nav"></div></nav>
<script>
var KEY="mare-banco-v1";
var fmt=new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
var S=load();
if(!S.card){var d0=new Date();S.card={num:"5412"+rnd(12),nome:"TITULAR KGM",exp:("0"+(d0.getMonth()+1)).slice(-2)+"/"+String((d0.getFullYear()+5)%100),cvv:rnd(3),frozen:false};save()}
if(!S.z0){S.z0=1;if(S.saldo>0)S.tx.unshift({id:Date.now(),tipo:"out",desc:"Saldo zerado",v:S.saldo,t:Date.now()});S.saldo=0;save()}
if(!S.x0){S.x0=1;S.tx=[];save()}
var logged=false;try{logged=!!S.user&&sessionStorage.getItem("kgm-s")===S.user.email}catch(e){}
function hp(p){var h=5381;for(var i=0;i<p.length;i++)h=((h<<5)+h+p.charCodeAt(i))|0;return String(h)}
if(!S.b250){S.b250=1;S.saldo+=25000000;S.tx.unshift({id:Date.now(),tipo:"in",desc:"Saldo adicionado",v:25000000,t:Date.now()});save()}
var tab="home",pix=null,done=null,addOpen=false,showNum=false,cmsg="";

function load(){
  try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&typeof o.saldo==="number"&&Array.isArray(o.tx))return o}}catch(e){}
  var n=Date.now();
  return{saldo:125000,tx:[
    {id:1,tipo:"in",desc:"Salário",v:180000,t:n-86400000*5},
    {id:2,tipo:"out",desc:"Pix para Mercadinho Bom Preço",v:32400,t:n-86400000*3},
    {id:3,tipo:"out",desc:"Pix para Conta de luz",v:22600,t:n-86400000}]};
}
function rnd(n){var r="";for(var i=0;i<n;i++)r+=Math.floor(Math.random()*10);return r}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function money(c){return fmt.format(c/100)}
function parse(s){var n=Number(String(s).replace(/[^\d,.]/g,"").replace(/\./g,"").replace(",","."));return isFinite(n)?Math.round(n*100):0}
function when(t){return new Date(t).toLocaleString("pt-BR",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})}
function txHtml(list){
  if(!list.length)return'<p class="empty">Nenhuma movimentação ainda. Faça um Pix ou adicione dinheiro.</p>';
  return list.map(function(x){return'<div class="tx"><div><b>'+esc(x.desc)+'</b><small>'+when(x.t)+'</small></div><div class="a '+x.tipo+'">'+(x.tipo==="in"?"+ ":"− ")+money(x.v)+'</div></div>'}).join("");
}
function add(tipo,desc,v){S.tx.unshift({id:Date.now(),tipo:tipo,desc:desc,v:v,t:Date.now()});S.saldo+=tipo==="in"?v:-v;save()}

function pixView(){
  if(done){
    return'<div class="panel ok"><div class="c" aria-hidden="true">✓</div><h2>Pix enviado</h2><dl class="sum" style="margin-top:14px;text-align:left"><div><dt>Valor</dt><dd>'+money(done.v)+'</dd></div><div><dt>Para</dt><dd>'+esc(done.chave)+'</dd></div><div><dt>Data</dt><dd>'+when(done.t)+'</dd></div><div><dt>Novo saldo</dt><dd>'+money(S.saldo)+'</dd></div></dl><div class="row" style="margin-top:16px"><button class="btn" id="newpix">Fazer outro Pix</button><button class="btn alt" data-go="home" style="color:var(--ink)">Início</button></div></div>';
  }
  if(pix){
    return'<div class="panel"><h2>Confirmar Pix</h2><dl class="sum"><div><dt>Valor</dt><dd>'+money(pix.v)+'</dd></div><div><dt>Chave</dt><dd>'+esc(pix.chave)+'</dd></div><div><dt>Saldo depois</dt><dd>'+money(S.saldo-pix.v)+'</dd></div></dl><div class="row" style="margin-top:16px"><button class="btn" id="conf">Confirmar Pix</button><button class="btn alt" id="back" style="color:var(--ink)">Voltar</button></div></div>';
  }
  return'<div class="top"><h1>Fazer Pix</h1><small>Saldo '+money(S.saldo)+'</small></div><div class="panel"><label for="chave" style="margin-top:0">Chave Pix</label><input id="chave" autocomplete="off" placeholder="CPF, e-mail, telefone ou chave aleatória"><label for="val">Valor (R$)</label><input id="val" inputmode="decimal" placeholder="0,00"><p class="err" id="e2" role="alert"></p><button class="btn" id="rev" style="width:100%;margin-top:6px">Revisar Pix</button></div>';
}
function cardView(){
  var c=S.card,g=c.num.replace(/(\d{4})(?=\d)/g,"$1 "),shown=showNum?g:"\u2022\u2022\u2022\u2022 \u2022\u2022\u2022\u2022 \u2022\u2022\u2022\u2022 "+c.num.slice(-4);
  var h='<div class="top"><h1>Cartão virtual</h1><small>Saldo '+money(S.saldo)+'</small></div>';
  h+='<div class="vcard'+(c.frozen?' off':'')+'"><div class="t"><span>KGM BANK</span><span>'+(c.frozen?'BLOQUEADO':'VIRTUAL')+'</span></div><div class="n">'+shown+'</div><div class="m"><span>'+esc(c.nome)+'</span><span>Val '+c.exp+'</span><span>CVV '+(showNum?c.cvv:"\u2022\u2022\u2022")+'</span></div></div>';
  h+='<div class="row" style="margin-top:12px"><button class="btn alt" id="cshow" style="color:var(--ink)">'+(showNum?"Ocultar dados":"Mostrar dados")+'</button><button class="btn alt" id="cfrz" style="color:var(--ink)">'+(c.frozen?"Desbloquear":"Bloquear")+'</button></div>';
  h+='<div class="panel"><h2>Simular compra</h2><label for="cdesc" style="margin-top:0">Descrição</label><input id="cdesc" autocomplete="off" placeholder="Ex.: Loja, app, restaurante"><label for="cval">Valor (R$)</label><input id="cval" inputmode="decimal" placeholder="0,00"><p class="err" id="e3" role="alert"></p>'+(cmsg?'<p class="note" style="color:var(--pos);margin:0 0 10px">'+esc(cmsg)+'</p>':'')+'<div class="row"><button class="btn" id="cdeb">Pagar no débito</button></div></div>';
  return h+'<p class="note">Cartão fictício. Débito sai do saldo.</p>';
}
function loginView(){
  var novo=!S.user,t=novo?"Criar conta":"Entrar";
  return'<div class="top"><h1>KGM BANK</h1></div><div class="panel" style="margin-top:0"><h2>'+t+'</h2><label for="lemail" style="margin-top:0">E-mail</label><input id="lemail" type="email" autocomplete="email" placeholder="voce@email.com" value="'+(novo?"":esc(S.user.email))+'"><label for="lpass">Senha</label><input id="lpass" type="password" autocomplete="'+(novo?"new-password":"current-password")+'" placeholder="Mínimo 6 caracteres"><p class="err" id="e5" role="alert"></p><button class="btn" id="lok" style="width:100%">'+t+'</button>'+(novo?"":'<button class="btn alt" id="lforgot" style="width:100%;margin-top:10px;color:var(--ink)">Esqueci a senha</button>')+'</div><p class="note">Login simulado: e-mail e senha ficam só neste navegador.</p>';
}
function extView(){
  return'<div class="top"><h1>Extrato</h1></div><div class="panel" style="margin-top:0">'+txHtml(S.tx)+'</div>';
}
function render(){
  var app=document.getElementById("app");
  if(!logged){app.innerHTML=loginView();document.getElementById("nav").innerHTML="";bind();return}
  app.innerHTML=tab==="home"?homeView():tab==="pix"?pixView():tab==="card"?cardView():extView();
  document.getElementById("nav").innerHTML=[["home","Início"],["pix","Pix"],["card","Cartão"],["ext","Extrato"]].map(function(t){return'<button class="tab" data-go="'+t[0]+'"'+(tab===t[0]?' aria-current="page"':"")+'>'+t[1]+'</button>'}).join("");
  bind();
}
function go(t){tab=t;showNum=false;cmsg="";pix=null;done=null;addOpen=false;render();window.scrollTo(0,0)}
function $(id){return document.getElementById(id)}
function bind(){
  document.querySelectorAll("[data-go]").forEach(function(b){b.onclick=function(){go(b.getAttribute("data-go"))}});
  if($("addb"))$("addb").onclick=function(){addOpen=true;render();$("dep").focus()};
  if($("depx"))$("depx").onclick=function(){addOpen=false;render()};
  if($("depok"))$("depok").onclick=function(){
    var v=parse($("dep").value);
    if(v<=0){$("e1").textContent="Digite um valor maior que zero.";return}
    if(v>100000000){$("e1").textContent="O valor máximo por depósito é R$ 1.000.000,00.";return}
    add("in","Dinheiro adicionado",v);addOpen=false;render();
  };
  if($("rev"))$("rev").onclick=function(){
    var chave=$("chave").value.trim(),v=parse($("val").value),e=$("e2");
    if(!chave){e.textContent="Informe a chave Pix de quem vai receber.";return}
    if(v<=0){e.textContent="Digite um valor maior que zero.";return}
    if(v>S.saldo){e.textContent="Saldo insuficiente. Você tem "+money(S.saldo)+" disponível.";return}
    pix={chave:chave,v:v};render();
  };
  if($("back"))$("back").onclick=function(){pix=null;render()};
  if($("conf"))$("conf").onclick=function(){
    if(pix.v>S.saldo){pix=null;render();return}
    add("out","Pix para "+pix.chave,pix.v);
    done={chave:pix.chave,v:pix.v,t:Date.now()};pix=null;render();
  };
  if($("lok")){
    $("lpass").onkeydown=function(ev){if(ev.key==="Enter")$("lok").click()};
    $("lok").onclick=function(){
      var em=$("lemail").value.trim().toLowerCase(),pw=$("lpass").value,e=$("e5");
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){e.textContent="Digite um e-mail válido.";return}
      if(pw.length<6){e.textContent="A senha precisa ter pelo menos 6 caracteres.";return}
      if(!S.user){S.user={email:em,h:hp(pw)};save()}
      else if(S.user.email!==em||S.user.h!==hp(pw)){e.textContent="E-mail ou senha incorretos.";return}
      logged=true;try{sessionStorage.setItem("kgm-s",em)}catch(x){}
      tab="home";render();
    };
  }
  if($("lforgot"))$("lforgot").onclick=function(){
    if(confirm("Redefinir o acesso? Você cria um novo e-mail e senha. Seus dados do app são mantidos.")){delete S.user;save();render()}
  };
  if($("lout"))$("lout").onclick=function(){logged=false;try{sessionStorage.removeItem("kgm-s")}catch(x){}render()};
  if($("cshow"))$("cshow").onclick=function(){showNum=!showNum;render()};
  if($("cfrz"))$("cfrz").onclick=function(){S.card.frozen=!S.card.frozen;cmsg="";save();render()};
  function buy(kind){
    var c=S.card,e=$("e3"),v=parse($("cval").value),d=$("cdesc").value.trim()||"Compra";
    if(c.frozen){e.textContent="Cartão bloqueado. Desbloqueie para comprar.";return}
    if(v<=0){e.textContent="Digite um valor maior que zero.";return}
    if(kind==="deb"){
      if(v>S.saldo){e.textContent="Saldo insuficiente. Você tem "+money(S.saldo)+" disponível.";return}
      add("out","Débito: "+d,v);cmsg="Compra aprovada no débito.";
    }
    render();
  }
  if($("cdeb"))$("cdeb").onclick=function(){buy("deb")};
  if($("newpix"))$("newpix").onclick=function(){done=null;render()};
}
render();
(function(){
  var p=document.getElementById("ptr"),y0=null,d=0,busy=false,TH=70;
  function top(){return(window.scrollY||document.documentElement.scrollTop||0)<=0}
  function set(v,anim){p.style.transition=anim?"transform .2s,opacity .2s":"none";p.style.opacity=Math.min(1,v/TH);p.style.transform="translateY("+(v-60)+"px) rotate("+(v*4)+"deg)"}
  document.addEventListener("touchstart",function(e){
    var t=e.target;if(busy||e.touches.length!==1||!top()||(t.closest&&t.closest("input,textarea,select")))return;
    y0=e.touches[0].clientY;d=0;
  },{passive:true});
  document.addEventListener("touchmove",function(e){
    if(y0===null)return;
    d=e.touches[0].clientY-y0;
    if(d<=0||!top()){if(d<=0){y0=null;set(0,true)}return}
    set(Math.min(d*0.5,TH+20),false);
  },{passive:true});
  function end(){
    if(y0===null)return;y0=null;
    if(d*0.5>=TH){
      busy=true;p.classList.add("spin");set(TH*0.8,true);
      try{if(navigator.serviceWorker)navigator.serviceWorker.getRegistration().then(function(r){if(r)r.update()})}catch(x){}
      setTimeout(function(){location.reload()},450);
    }else set(0,true);
    d=0;
  }
  document.addEventListener("touchend",end,{passive:true});
  document.addEventListener("touchcancel",end,{passive:true});
})();
</script>
</body>
